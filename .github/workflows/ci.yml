name: CI
on: [push, pull_request]
jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Extract + load raw data
        run: python ingest/extract_load.py
      - name: dbt build (models + tests)
        run: cd transform && dbt build --profiles-dir . --full-refresh
      - name: End-to-end tests
        run: pytest -q
